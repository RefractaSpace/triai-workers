<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>TriAI</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141922" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TriAI">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 4 29 27H3Z' fill='%233D4DB7'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<aside id="side">
  <div class="brand"><svg class="tri" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 20 18H4Z"/><circle cx="12" cy="4" r="3" class="on-claude"/><circle cx="4" cy="18" r="3" class="on-gpt"/><circle cx="20" cy="18" r="3" class="on-gemini"/></svg>TriAI</div>
  <button class="nav primary" id="newChat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 대화</button>
  <button class="nav" data-go="models"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M9 16v4M15 16v4M7 9h2M11 9h2M15 9h2"/></svg>모델</button>
  <button class="nav" data-go="bots"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 17h6"/></svg>봇<span class="badge" id="botBadge" hidden></span></button>
  <button class="nav" data-go="projects"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>프로젝트</button>
  <button class="nav" data-go="skills"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h5M9 12h5"/></svg>스킬</button>
  <button class="nav" data-go="artifacts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>아티팩트</button>
  <button class="nav" data-go="connections"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/></svg>연결</button>
  <button class="nav" data-go="admin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>관리</button>
  <input class="side-search" id="searchIn" placeholder="대화 검색" aria-label="대화 검색">
  <div class="conv-head" id="convHead">최근 대화</div>
  <div id="convs"></div>
  <div class="spend">
    <div id="spendText">오늘 사용 $0.0000</div>
    <div class="bar"><i id="spendBar"></i></div>
    <button class="nav" id="installApp" style="padding-left:0" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>앱으로 설치</button>
    <button class="nav" id="openSettings" style="padding-left:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>설정</button>
  </div>
</aside>
<div id="scrim" aria-hidden="true"></div>

<main id="main">
  <header>
    <button class="icon-btn" id="toggleSide" aria-label="사이드바 열고 닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <button class="crumb" id="crumb" hidden></button>
    <div id="picker-wrap">
      <button id="picker" aria-haspopup="true"><svg class="tri" id="pickerTri" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 20 18H4Z"/><circle cx="12" cy="4" r="3"/><circle cx="4" cy="18" r="3"/><circle cx="20" cy="18" r="3"/></svg><span id="pickerLabel">Claude</span><small id="pickerModel"></small>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="menu" role="menu"></div>
    </div>
    <div class="spacer"></div>
    <div style="position:relative">
      <button class="icon-btn" id="convMenuBtn" aria-label="대화 메뉴" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="menu" id="convMenu">
        <button class="opt" data-cm="rename">이름 바꾸기</button>
        <button class="opt" data-cm="move">프로젝트로 옮기기</button>
        <button class="opt" data-cm="export">마크다운으로 내보내기</button>
        <button class="opt" data-cm="share" id="cmShare" hidden>👥 팀에 공유</button>
        <button class="opt" data-cm="archive">보관함 보기 (이전 버전)</button>
        <div class="sep"></div>
        <button class="opt danger" data-cm="delete">삭제</button>
      </div>
    </div>
  </header>

  <div id="empty">
    <svg class="tri" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 20 18H4Z"/><circle cx="12" cy="4" r="3" class="on-claude"/><circle cx="4" cy="18" r="3" class="on-gpt"/><circle cx="20" cy="18" r="3" class="on-gemini"/></svg>
    <h1>무엇을 물어볼까요?</h1>
  </div>
  <div id="scroll" hidden><div id="thread"></div></div>
  <div id="page" hidden></div>

  <div id="composer-wrap">
    <div id="composer">
      <div id="attachRow" class="attach-row" hidden></div>
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요"></textarea>
      <div class="comp-row">
        <button class="icon-btn" id="attachBtn" aria-label="파일·이미지 첨부" title="파일·이미지 첨부 (끌어다 놓기·붙여넣기도 가능)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21 12-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg></button>
        <input type="file" id="attachIn" multiple hidden>
        <div class="comp-tools">
        <button class="icon-btn tog" id="webBtn" aria-label="웹 검색" aria-pressed="false" title="웹 검색 켜고 보내기 — 먼저 검색해서 출처와 함께 답해요"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
        <button class="icon-btn tog" id="deepBtn" aria-label="깊게 생각" aria-pressed="false" title="깊게 생각 — 이 질문은 오래 생각하고 답해요 (수학·코딩·어려운 문제용, 한도·비용을 더 씀)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
        <button class="icon-btn tog" id="micBtn" aria-label="음성 입력" title="눌러서 말하기 · 다시 누르면 끝 (내 컴퓨터에서 인식)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="icon-btn tog" id="agentBtn" aria-label="에이전트 모드" aria-pressed="false" title="에이전트 모드 — 계획을 세우고 도구(계산·검색·파일)를 여러 번 써서 끝까지 해냄"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h7M4 17h5"/><path d="m15 14 2 2 4-4"/></svg></button>
        <select id="presetSel" class="style-sel" aria-label="생성 설정 프리셋" title="생성 설정 프리셋 (온도 등)"></select>
        <select id="styleSel" class="style-sel" aria-label="답변 스타일" title="답변 스타일">
          <option value="default">말투: 기본</option><option value="concise">간결하게</option><option value="detailed">자세하게</option>
          <option value="beginner">쉽게 (초보자)</option><option value="formal">격식 있게</option></select>
        </div>
        <span class="hint" id="hint">Enter 보내기 · Shift+Enter 줄바꿈</span>
        <button id="send" aria-label="보내기" disabled></button>
      </div>
    </div>
    <div class="foot">AI는 틀릴 수 있어요. 중요한 내용은 비교 모드로 교차 확인하세요.</div>
  </div>
</main>

<div id="dlg" role="dialog" aria-modal="true"><div class="panel" id="dlgPanel"></div></div>
<div id="toast"></div>

<script src="/static/js/app-bridge.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/artifact.js"></script>
<script src="/static/js/chart.js"></script>
<script src="/static/js/sidebar.js"></script>
<script src="/static/js/thread.js"></script>
<script src="/static/js/composer.js"></script>
<script src="/static/js/device.js"></script>
<script src="/static/js/camera.js"></script>
<script src="/static/js/projects.js"></script>
<script src="/static/js/skills.js"></script>
<script src="/static/js/gallery.js"></script>
<script src="/static/js/connections.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/bots.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/features.js"></script>
<script src="/static/js/modes.js"></script>
<script src="/static/js/lmstudio.js"></script>
<script src="/static/js/agents.js"></script>
<script src="/static/js/team.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/js/serverless.js"></script>
</body>
</html>
