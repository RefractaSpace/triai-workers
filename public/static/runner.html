<!doctype html>
<html><head><meta charset="utf-8"><title>코드 실행 상자</title></head>
<body>
<script>
/* 코드 실행 상자 — AI가 쓴 ```run 파이썬 코드를 브라우저 안에서 실행 (Pyodide = WebAssembly 파이썬)
   · 이 창은 격리돼 있음: sandbox(출처 없음) + 서버가 붙인 CSP → TriAI 데이터·쿠키·내 파일에 접근 불가, 받아오기는 CDN만
   · 실제 실행은 이 창 안의 워커(따로 도는 일꾼)에서 → 무한 반복이어도 화면이 안 멈추고, 시간이 넘으면 워커를 끝냄
   · 부모 화면 ↔ 이 창: postMessage {run:{id,code}} → {runResult:{id, ok, stdout, error, images[], sec}} */
(function(){
  for (const k of ["RTCPeerConnection","webkitRTCPeerConnection","RTCDataChannel"]) { try { delete window[k]; window[k] = undefined; } catch(e){} }
  var PY = "https://cdn.jsdelivr.net/pyodide/v0.27.2/full/";
  var LIMIT = 90000;   // 한 번 실행 최대 90초 (처음엔 파이썬·패키지 내려받는 시간 포함)
  var WORKER = [
    "self.RTCPeerConnection=undefined;",
    "importScripts('" + PY + "pyodide.js');",
    "var ready=loadPyodide({indexURL:'" + PY + "'}).then(function(py){ py.runPython(\"import os; os.environ['MPLBACKEND']='AGG'\"); return py; });",
    "var FIGS = \"import sys\\n_out=[]\\nif 'matplotlib' in sys.modules:\\n  import matplotlib.pyplot as _plt, io as _io, base64 as _b\\n  for _n in _plt.get_fignums()[:6]:\\n    _f=_plt.figure(_n); _bb=_io.BytesIO(); _f.savefig(_bb, format='png', dpi=110, bbox_inches='tight'); _out.append(_b.b64encode(_bb.getvalue()).decode())\\n  _plt.close('all')\\n_out\";",
    "onmessage=async function(e){ var id=e.data.id, code=e.data.code, out='', t0=Date.now();",
    "  try{ var py=await ready; postMessage({id:id, status:'실행 중…'});",
    "    py.setStdout({batched:function(s){ if(out.length<200000) out+=s+'\\n'; }}); py.setStderr({batched:function(s){ if(out.length<200000) out+=s+'\\n'; }});",
    "    await py.loadPackagesFromImports(code);",
    "    var g=py.globals.get('dict')();",
    "    await py.runPythonAsync(code,{globals:g});",
    "    var figs=py.runPython(FIGS,{globals:g}); var imgs=figs?figs.toJs():[]; if(figs&&figs.destroy)figs.destroy(); g.destroy();",
    "    postMessage({id:id, done:{ok:true, stdout:out, images:imgs, sec:(Date.now()-t0)/1000}});",
    "  }catch(err){ var m=String(err&&err.message||err); var lines=m.split('\\n'); var tail=lines.slice(-12).join('\\n');",
    "    postMessage({id:id, done:{ok:false, stdout:out, error:tail, images:[], sec:(Date.now()-t0)/1000}}); }",
    "};"
  ].join("\n");
  var url = URL.createObjectURL(new Blob([WORKER], {type:"text/javascript"}));
  var w = null, cur = null, timer = null;
  function fresh(){ if (w) w.terminate(); w = new Worker(url); w.onmessage = onW; w.onerror = function(e){ finish({ok:false, stdout:"", error:"실행 상자 오류: "+(e.message||"알 수 없음"), images:[], sec:0}); fresh(); }; }
  function finish(r){ if (!cur) return; clearTimeout(timer); parent.postMessage({runResult: Object.assign({id: cur.id}, r)}, "*"); cur = null; }
  function onW(e){
    if (!cur || e.data.id !== cur.id) return;
    if (e.data.status) parent.postMessage({runStatus: {id: cur.id, text: e.data.status}}, "*");
    if (e.data.done) finish(e.data.done);
  }
  window.addEventListener("message", function(e){
    if (e.source !== parent || !e.data || !e.data.run) return;
    var r = e.data.run;
    if (cur) return parent.postMessage({runResult: {id: r.id, ok:false, error:"다른 코드가 실행 중이에요", images:[], sec:0}}, "*");
    cur = {id: String(r.id)};
    timer = setTimeout(function(){ finish({ok:false, stdout:"", error:"시간 초과 ("+(LIMIT/1000)+"초) — 무한 반복이거나 너무 오래 걸리는 코드예요", images:[], sec:LIMIT/1000}); fresh(); }, LIMIT);
    parent.postMessage({runStatus: {id: cur.id, text: "파이썬 준비 중… (처음엔 10초쯤)"}}, "*");
    w.postMessage({id: cur.id, code: String(r.code || "")});
  });
  fresh();
  parent.postMessage({runReady: true}, "*");
})();
</script>
</body></html>
