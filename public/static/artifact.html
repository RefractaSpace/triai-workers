<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="x-dns-prefetch-control" content="off">
<title>아티팩트</title></head>
<body style="margin:0;font-family:sans-serif">
<script>
/* 아티팩트 전용 창.
   이 페이지는 서버가 '밖으로 보내기 전부 금지' 보안 정책(CSP)을 붙여서 보내요.
   부모 화면이 AI가 만든 HTML을 메시지로 보내면, 이 창이 그대로 그려서 실행해요.
   → 스크립트는 돌지만 fetch·외부 이미지·폼 전송·외부 사이트 이동은 막혀요. */
(function(){
  // CSP가 못 막는 통로(WebRTC)도 미리 없애둠
  for (const k of ["RTCPeerConnection","webkitRTCPeerConnection","RTCDataChannel"]) { try { delete window[k]; window[k] = undefined; } catch(e){} }
  // 오류 알리미: document.write로 새 문서를 쓰면 여기서 단 이벤트는 사라져서, 아티팩트 HTML 안(<head> 바로 뒤)에 넣어 줌
  //  (<!doctype> 앞에 넣으면 호환 모드가 돼서 화면이 달라짐)
  var REP = "<scr"+"ipt>(function(){var n=0;function s(m){if(n++<5)parent.postMessage({artifactError:String(m||'알 수 없는 오류').slice(0,600)},'*')}"
    + "addEventListener('error',function(e){s(e.message||(e.error&&e.error.message)||(e.target&&e.target.src?'불러오기 실패: '+e.target.src:''))},true);"
    + "addEventListener('unhandledrejection',function(e){s('Promise 오류: '+((e.reason&&e.reason.message)||e.reason))});"
    + "window.__artErr=s;})();</scr"+"ipt>";
  function inject(h){
    if (/<head[^>]*>/i.test(h)) return h.replace(/<head[^>]*>/i, function(m){ return m + REP });
    if (/<html[^>]*>/i.test(h)) return h.replace(/<html[^>]*>/i, function(m){ return m + REP });
    return h.replace(/^(\s*<!doctype[^>]*>)?/i, function(m){ return m + REP });
  }
  window.addEventListener("message", function(e){
    if (e.source !== parent || typeof e.data?.html !== "string") return;
    document.open(); document.write(inject(e.data.html)); document.close();
  }, { once: true });
  parent.postMessage({ artifactReady: true }, "*");
})();
</script>
</body></html>
